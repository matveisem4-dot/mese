<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>P2P Messenger</title>
  <link rel="stylesheet" href="css/styles.css" />
  <!-- PeerJS с CDN: не требует сборки, работает на статическом хостинге -->
  <script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>
  <link rel="manifest" href="manifest.webmanifest" />
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div class="sidebar-header">
        <input type="search" id="chat-search" placeholder="Поиск чатов…" />
        <button id="new-chat-btn" title="Новый чат">+</button>
      </div>
      <ul id="chat-list"></ul>
      <div class="sidebar-footer">
        <span id="my-peer-id" class="muted"></span>
        <button id="theme-toggle">🌙</button>
      </div>
    </aside>

    <main id="chat-panel">
      <header id="chat-header" class="hidden">
        <button id="back-btn" class="mobile-only">←</button>
        <div id="chat-title"></div>
        <div id="chat-status" class="muted"></div>
        <button id="call-btn" title="Позвонить">📞</button>
      </header>

      <div id="messages" class="messages"></div>

      <div id="composer" class="composer hidden">
        <button id="emoji-btn">😊</button>
        <button id="attach-btn">📎</button>
        <input type="file" id="file-input" multiple hidden />
        <textarea id="message-input" rows="1" placeholder="Написать сообщение…"></textarea>
        <button id="send-btn">➤</button>
      </div>
    </main>
  </div>

  <!-- Шаблоны -->
  <template id="chat-item-tpl">
    <li class="chat-item">
      <div class="avatar"></div>
      <div class="chat-meta">
        <div class="chat-name"></div>
        <div class="chat-last muted"></div>
      </div>
      <div class="chat-badge hidden"></div>
    </li>
  </template>

  <script type="module" src="js/app.js"></script>
  <script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js').catch(console.error);
  }
</script>
</body>
</html>
